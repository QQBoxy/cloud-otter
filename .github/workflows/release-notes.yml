name: Release Notes

on: workflow_call

jobs:
  release-notes:
    name: Create release draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: cloud-otter-release
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release range
        id: range
        shell: bash
        run: |
          latest_tag=$(git tag --merged HEAD --sort=-version:refname |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !seen++ { print }')
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

          if [[ -n "$latest_tag" && "$(git rev-list -1 "$latest_tag")" == "$GITHUB_SHA" ]]; then
            echo 'args=--current' >> "$GITHUB_OUTPUT"
          else
            main_ref=$(git ls-remote --exit-code origin refs/heads/main)
            if [[ "${main_ref%%[[:space:]]*}" == "$GITHUB_SHA" ]]; then
              echo 'args=--unreleased --bump' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate release notes
        id: notes
        if: steps.range.outputs.args != ''
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          args: ${{ steps.range.outputs.args }} --use-branch-tags --strip all --no-exec
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Create tag and GitHub Release draft
        if: steps.range.outputs.args != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.notes.outputs.version }}
          LATEST_TAG: ${{ steps.range.outputs.latest_tag }}
          RELEASE_RANGE: ${{ steps.range.outputs.args }}
        run: bash scripts/create-release-draft.sh
