name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Keep the status check name required by the main branch ruleset.
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  deploy:
    name: Deploy production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    concurrency:
      group: cloud-otter-production
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Upload and deploy Worker version
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "${main_ref%%[[:space:]]*}" != "$GITHUB_SHA" ]]; then
            echo "Skipping deployment because main has advanced."
            exit 0
          fi

          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          version_tag="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pnpm exec wrangler versions upload --env production --tag "$version_tag"
          pnpm exec wrangler versions deploy --env production --version-tag "$version_tag" --yes
          echo 'deployed=true' >> "$GITHUB_OUTPUT"

  release:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
